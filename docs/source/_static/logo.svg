<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="transformer-playground logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="sheen" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- hexagon badge -->
  <polygon points="100,14 168,54 168,146 100,186 32,146 32,54"
           fill="url(#bg)"/>
  <polygon points="100,14 168,54 168,146 100,186 32,146 32,54"
           fill="url(#sheen)"/>

  <!-- attention motif: one query token fanning out to every key token,
       line opacity encodes attention weight -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <line x1="100" y1="132" x2="52"  y2="76"  stroke-opacity="0.85"/>
    <line x1="100" y1="132" x2="76"  y2="66"  stroke-opacity="0.35"/>
    <line x1="100" y1="132" x2="100" y2="62"  stroke-opacity="0.55"/>
    <line x1="100" y1="132" x2="124" y2="66"  stroke-opacity="0.30"/>
    <line x1="100" y1="132" x2="148" y2="76"  stroke-opacity="0.65"/>
  </g>

  <!-- key tokens (top row) -->
  <g fill="#ffffff">
    <circle cx="52"  cy="76" r="7"  opacity="0.9"/>
    <circle cx="76"  cy="66" r="6"  opacity="0.55"/>
    <circle cx="100" cy="62" r="6.5" opacity="0.75"/>
    <circle cx="124" cy="66" r="6"  opacity="0.5"/>
    <circle cx="148" cy="76" r="7"  opacity="0.85"/>
  </g>

  <!-- query token (bottom, the one attending) -->
  <circle cx="100" cy="132" r="10" fill="#ffffff"/>
</svg>
